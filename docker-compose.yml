version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: predia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-predia_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - predia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-predia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  predia_pgdata:
    driver: local
