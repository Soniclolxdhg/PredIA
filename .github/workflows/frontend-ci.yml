name: Frontend CI

on:
  push:
    branches: [ main, feature/frontend ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    # Solo se ejecuta cuando el proyecto frontend ya exista con su package-lock.json
    if: hashFiles('frontend/package-lock.json') != ''

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular SPA
        run: npm run build -- --configuration production
