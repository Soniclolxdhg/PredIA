<header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-sm">
  <!-- Botón para menú en móviles -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 touch-target focus:outline-none"
      aria-label="Abrir menú">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Notificaciones de stock y datos del usuario autenticado -->
  <div class="flex items-center gap-2 sm:gap-4 ml-auto">
    <!-- Notificación rápida de Alertas (Fase 3) -->
    <a
      *ngIf="erpService.insumosCriticos().length > 0"
      routerLink="/bodega/alertas"
      class="px-2.5 py-1 text-xs font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-300 rounded-lg transition-colors flex items-center gap-1.5 animate-pulse"
      title="Alertas Activas">
      <span>🚨</span>
      <span class="hidden md:inline">Alertas:</span>
      <span class="font-mono">{{ erpService.insumosCriticos().length }}</span>
    </a>

    <!-- Usuario activo: Hola, [Nombre] y Rol abajo -->
    <div class="flex items-center gap-3 border-l border-slate-200 pl-3">
      <div class="text-right">
        <div class="text-xs font-bold text-slate-800">
          Hola, {{ authService.currentUser()?.nombre_completo || 'Usuario' }}
        </div>
        <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">
          {{ authService.userRole() }}
        </div>
      </div>

      <button
        type="button"
        (click)="authService.logout()"
        class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg transition-colors touch-target"
        title="Cerrar Sesión">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
